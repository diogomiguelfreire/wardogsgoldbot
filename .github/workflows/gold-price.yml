name: Post gold price

on:
  schedule:
    # Every hour at minute 5 (UTC). Minute 0 is GitHub's busiest slot, so runs there get delayed more.
    - cron: "5 * * * *"
  workflow_dispatch: # lets you trigger a post by hand from the Actions tab

concurrency:
  group: gold-price
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # Keeps state.json (last posted price) between runs for the "Since last post" field.
      - uses: actions/cache@v4
        with:
          path: state.json
          key: gold-state-${{ github.run_id }}
          restore-keys: gold-state-

      - run: python post_once.py
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          CHART_DAYS: ${{ vars.CHART_DAYS }}
          ONLY_POST_ON_CHANGE: ${{ vars.ONLY_POST_ON_CHANGE }}
          ALERT_BELOW: ${{ vars.ALERT_BELOW }}
